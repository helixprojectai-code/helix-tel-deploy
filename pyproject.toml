[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "helix-tel"
version = "1.0.0"
description = "Constitutional Convergence Cryptography — zero-exchange key derivation from AI behavioral invariants"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Stephen Hope", email = "sbhope@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "click>=8.1",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/helixprojectai-code/helix-tel-deploy"

[project.scripts]
tel = "tel_deploy.cli:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["tel_deploy*"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]
