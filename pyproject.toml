[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "helix-tel"
version = "2.0.0"
description = "Constitutional Convergence Cryptography — zero-exchange key derivation from AI behavioral invariants"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Stephen Hope", email = "sbhope@gmail.com" }]
requires-python = ">=3.10"
keywords = [
    "cryptography",
    "zero-knowledge",
    "key-derivation",
    "ai",
    "constitutional",
    "mesh",
    "encryption",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security :: Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "httpx>=0.27",
    "click>=8.1",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/helixprojectai-code/helix-tel-deploy"
Documentation = "https://github.com/helixprojectai-code/helix-tel-deploy#readme"
"Release Notes" = "https://github.com/helixprojectai-code/helix-tel-deploy/releases"

[project.scripts]
tel = "tel_deploy.cli:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["tel_deploy*"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tel_deploy/tests"]
